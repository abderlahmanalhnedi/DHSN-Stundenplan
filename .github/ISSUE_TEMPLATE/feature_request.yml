name: "Feature request / Funktionswunsch"
description: "Suggest a feature without sharing student or timetable data."
title: "[Feature] "
body:
  - type: textarea
    id: request
    attributes:
      label: "Proposed feature / Gewünschte Funktion"
      description: "Please describe the use case. / Bitte Anwendungsfall beschreiben."
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: "Benefit / Nutzen"
      description: "How would it help students? / Wie hilft es Studierenden?"
    validations:
      required: true
